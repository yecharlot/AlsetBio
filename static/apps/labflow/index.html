<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alset LabFlow</title>
  <style>
    :root { --bg:#0b0c10; --card:#161822; --text:#e8e9ef; --muted:#8b90a0; --accent:#6c63ff; --ok:#25d366; --gold:#f4b400; --danger:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); padding:1rem; }
    header { max-width:1100px; margin:0 auto 1rem; display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; justify-content:space-between; }
    h1 { font-size:1.25rem; margin:0; }
    .badge { background:rgba(108,99,255,.15); color:var(--accent); font-size:.7rem; font-weight:700; padding:.2rem .55rem; border-radius:999px; }
    .sub { color:var(--muted); font-size:.85rem; width:100%; }
    .cid { font-size:.72rem; color:var(--gold); word-break:break-all; }
    .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:.6rem; max-width:1100px; margin:0 auto 1rem; }
    .stat { background:var(--card); border-radius:12px; padding:.85rem; border:1px solid rgba(255,255,255,.06); text-align:center; }
    .stat .n { font-size:1.4rem; font-weight:800; }
    .stat .l { font-size:.7rem; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
    .grid { display:grid; gap:1rem; grid-template-columns:1fr; max-width:1100px; margin:0 auto; }
    @media(min-width:900px){ .grid { grid-template-columns:1fr 1.2fr; } }
    .card { background:var(--card); border-radius:14px; padding:1.1rem; border:1px solid rgba(255,255,255,.06); }
    label { display:block; font-size:.72rem; color:var(--muted); margin:.45rem 0 .15rem; }
    input, select, button { width:100%; padding:.55rem .7rem; border-radius:8px; border:1px solid rgba(255,255,255,.1); background:#0f1118; color:var(--text); }
    button { background:var(--accent); border:none; font-weight:700; cursor:pointer; margin-top:.55rem; }
    button.secondary { background:#2a2d3a; }
    button.danger { background:#5a2030; }
    .row { padding:.55rem 0; border-bottom:1px solid rgba(255,255,255,.06); font-size:.88rem; cursor:pointer; }
    .row:hover { background:rgba(255,255,255,.03); }
    .status { font-size:.7rem; font-weight:700; padding:.15rem .4rem; border-radius:6px; background:#2a2d3a; }
    pre { white-space:pre-wrap; font-size:.72rem; background:#0f1118; padding:.7rem; border-radius:8px; overflow:auto; max-height:260px; }
    .qrwrap { text-align:center; margin-top:.75rem; }
    .qrwrap img { background:#fff; border-radius:8px; padding:8px; max-width:180px; }
    .timeline { font-size:.8rem; }
    .timeline div { padding:.35rem 0; border-left:2px solid var(--accent); margin-left:.3rem; padding-left:.7rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <span class="badge">AlsetBio · LabFlow</span>
      <h1>Laboratory sample workflow</h1>
      <div class="sub">Persistencia IPFS (CID) en el Nodo Alset · root: <span class="cid" id="rootCid">—</span></div>
    </div>
    <button class="secondary" style="width:auto;padding:.5rem 1rem" onclick="refreshAll()">Actualizar</button>
  </header>

  <div class="stats" id="stats"></div>

  <div class="grid">
    <div class="card">
      <h2 style="margin:0 0 .5rem;font-size:1rem">Nueva muestra</h2>
      <label>Workflow</label>
      <select id="workflow">
        <option value="default">default</option>
        <option value="water-testing">water-testing</option>
        <option value="clinical">clinical</option>
      </select>
      <label>Tipo</label><input id="type" value="blood" />
      <label>Org / Lab</label><input id="org" value="lab-default" />
      <label>Cliente</label><input id="client" value="client-demo" />
      <label>Ubicación</label><input id="loc" value="Receiving-A" />
      <label>Actor</label><input id="actor" value="tech-1" />
      <label>Rol (dev)</label>
      <select id="role">
        <option>TECHNICIAN</option>
        <option>REVIEWER</option>
        <option>LAB_MANAGER</option>
        <option>LAB_ADMIN</option>
        <option>CLIENT</option>
      </select>
      <button onclick="createSample()">Crear (IPFS)</button>
      <pre id="createOut">—</pre>
    </div>

    <div class="card">
      <h2 style="margin:0 0 .5rem;font-size:1rem">Muestras</h2>
      <div id="sampleList"><p class="sub">Cargando…</p></div>
    </div>

    <div class="card" style="grid-column:1/-1">
      <h2 style="margin:0 0 .5rem;font-size:1rem">Detalle · transición · QR</h2>
      <label>Sample ID</label><input id="sid" placeholder="smp_..." />
      <label>Nuevo estado</label>
      <select id="toStatus">
        <option>ASSIGNED</option>
        <option>IN_PROGRESS</option>
        <option>QC_REVIEW</option>
        <option>RELEASED</option>
        <option>FLAGGED</option>
        <option>ARCHIVED</option>
      </select>
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem">
        <button onclick="doTransition()">Transicionar</button>
        <button class="secondary" onclick="showDetail()">Detalle</button>
        <button class="secondary" onclick="verify()">Verificar</button>
      </div>
      <div class="qrwrap" id="qrBox" style="display:none">
        <img id="qrImg" alt="QR verify" />
        <div class="sub">Escanea para abrir la página de verificación pública</div>
      </div>
      <div class="timeline" id="timeline"></div>
      <pre id="detailOut">—</pre>
    </div>
  </div>

<script>
function labHeaders(extra) {
  const h = Object.assign({
    'X-Lab-Role': (document.getElementById('role')||{}).value || 'TECHNICIAN',
    'X-Lab-Org': (document.getElementById('org')||{}).value || 'lab-default',
    'X-Lab-Actor': (document.getElementById('actor')||{}).value || 'dev-user'
  }, extra||{});
  const tok = localStorage.getItem('labflow_token');
  if (tok) h['Authorization'] = 'Bearer ' + tok;
  return h;
}
async function j(url, opt) {
  opt = opt || {};
  opt.headers = Object.assign(labHeaders(opt.headers), opt.headers||{});
  const r = await fetch(url, opt);
  const t = await r.text();
  try { return { ok: r.ok, status: r.status, data: JSON.parse(t) }; }
  catch { return { ok: r.ok, status: r.status, data: t }; }
}
function esc(s){ return String(s||'').replace(/[<>&]/g, c=>({ '<':'&lt;','>':'&gt;','&':'&amp;' }[c])); }

async function loadStats() {
  const res = await j('/api/labflow/stats');
  const s = res.data || {};
  document.getElementById('rootCid').textContent = s.root_cid || '(vacío)';
  const cells = [
    ['Total', s.total], ['Received', s.received], ['Assigned', s.assigned],
    ['In progress', s.in_progress], ['QC', s.qc_review], ['Released', s.released],
    ['Flagged', s.flagged], ['Archived', s.archived]
  ];
  document.getElementById('stats').innerHTML = cells.map(([l,n]) =>
    `<div class="stat"><div class="n">${n??0}</div><div class="l">${l}</div></div>`).join('');
}

async function createSample() {
  const body = {
    type: type.value, workflow_id: workflow.value, org_id: org.value, client_id: client.value,
    location: loc.value, actor: actor.value
  };
  const res = await j('/api/labflow/samples', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  });
  createOut.textContent = JSON.stringify(res.data, null, 2);
  if (res.data && res.data.sample) {
    sid.value = res.data.sample.id;
    showQR(res.data.sample.id);
  }
  refreshAll();
}

async function loadSamples() {
  const res = await j('/api/labflow/samples');
  const list = (res.data && res.data.samples) || [];
  sampleList.innerHTML = list.length ? list.map(s =>
    `<div class="row" onclick="selectSample('${esc(s.id)}')">
      <strong>${esc(s.external_id)}</strong> <span class="status">${esc(s.status)}</span>
      <div class="cid">${esc(s.id)}</div>
    </div>`).join('') : '<p class="sub">Sin muestras</p>';
}

function selectSample(id) {
  sid.value = id;
  showDetail();
  showQR(id);
}

function showQR(id) {
  qrBox.style.display = 'block';
  qrImg.src = '/api/labflow/qr/' + encodeURIComponent(id) + '?t=' + Date.now();
}

async function doTransition() {
  const id = sid.value.trim();
  const res = await j('/api/labflow/samples/' + encodeURIComponent(id) + '/transition', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ to_status: toStatus.value, actor: actor.value })
  });
  detailOut.textContent = JSON.stringify(res.data, null, 2);
  refreshAll();
  if (res.ok) showDetail();
}

async function showDetail() {
  const id = sid.value.trim();
  const res = await j('/api/labflow/samples/' + encodeURIComponent(id));
  detailOut.textContent = JSON.stringify(res.data, null, 2);
  const evs = (res.data && res.data.events) || [];
  timeline.innerHTML = evs.map(e =>
    `<div><strong>${esc(e.type)}</strong> ${esc(e.previous_state||'—')} → ${esc(e.new_state||'')}
     <div class="cid">${esc(e.evidence_ref||'')}</div></div>`).join('') || '';
  showQR(id);
}

async function verify() {
  const id = sid.value.trim();
  const res = await j('/api/labflow/verify/' + encodeURIComponent(id));
  detailOut.textContent = JSON.stringify(res.data, null, 2);
  window.open('/verify/' + encodeURIComponent(id), '_blank');
}

async function refreshAll() {
  await loadStats();
  await loadSamples();
}
refreshAll();
</script>
</body>
</html>
