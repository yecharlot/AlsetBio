<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alset LabFlow</title>
  <style>
    :root { --bg:#0b0c10; --card:#161822; --text:#e8e9ef; --muted:#8b90a0; --accent:#6c63ff; --ok:#25d366; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text);
      min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
    .card { background:var(--card); border-radius:16px; padding:2rem; max-width:420px; width:100%;
      border:1px solid rgba(255,255,255,0.06); }
    h1 { margin:0 0 0.5rem; font-size:1.4rem; }
    p { color:var(--muted); line-height:1.5; }
    .badge { display:inline-block; background:rgba(108,99,255,0.15); color:var(--accent);
      font-size:0.75rem; font-weight:700; padding:0.25rem 0.6rem; border-radius:999px; margin-bottom:1rem; }
    code { color:var(--ok); font-size:0.85rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">AlsetBio · LabFlow</div>
    <h1>Laboratory sample workflow</h1>
    <p>Base del vertical de laboratorio sobre el Nodo Alset. Dominio de muestras, cadena de custodia y verificación en construcción sobre este nodo.</p>
    <p><code>/w/labflow.app.ans</code></p>
  </div>
</body>
</html>
